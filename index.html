  :root {
    --sky1: #7fd4ff; --sky2: #b8f0ff;
    --ink: #2b2250;
    --purple: #8b5cf6; --teal: #14b8a6; --pink: #f472b6; --lime: #84cc16;
    --op: #fb923c; --eq: #22c55e; --clr: #ef4444;
    --cube: #ffd23f; --cube-side: #e0a800;
    --one: #ff8a3d; --one-side: #d9601a;
    --ten: #22b8cf; --ten-side: #13899b;
    --hun: #a26bff; --hun-side: #7340d6;
    --tho: #ff5fa2; --tho-side: #d23a7c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Fredoka', ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--sky1), var(--sky2));
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding-block: 14px; padding-inline: 16px; user-select: none; overflow-x: hidden; overflow-y: auto; background-attachment: fixed;
    -webkit-app-region: no-drag;
  }
  h1 {
    margin: 4px 0 10px; font-size: 26px; letter-spacing: .5px;
    color: #fff; text-shadow: 0 3px 0 #3b82f6, 0 5px 8px rgba(0,0,0,.2);
  }
  h1 span:nth-child(1){color:#ffe066} h1 span:nth-child(2){color:#ff9ad5} h1 span:nth-child(3){color:#b9ff8a}
  .calc { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }

  .screen {
    background: #fffdf5; border-radius: 26px; padding: 12px 16px 14px;
    box-shadow: inset 0 -6px 0 #f1e7c7, 0 8px 0 #3b82f6, 0 12px 20px rgba(0,0,0,.18);
    border: 4px solid #3b82f6;
    flex: 1 1 auto; min-height: 430px; display: flex; flex-direction: column;
  }
  .expr { font-size: 22px; min-height: 30px; color: #6b5fa8; text-align: right; word-break: break-all; }
  .answer { font-size: 54px; font-weight: 800; text-align: right; line-height: 1.05; min-height: 58px; }
  .answer.pop { animation: pop .35s ease; }
  @keyframes pop { 0%{transform:scale(.7)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .blocks {
    flex: 1; margin-top: 8px; border-top: 3px dashed #e8dcb5; padding-top: 10px;
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 14px;
    min-height: 120px; overflow-y: auto;
  }
  .hint { color: #9a8fc9; font-size: 18px; align-self: center; text-align: center; }
  .group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .group .items { display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-end; justify-content: center; max-width: 380px; }
  .label { font-size: 15px; font-weight: 700; background: #f3edff; padding: 2px 10px; border-radius: 12px; }
  .neg-note { width: 100%; text-align: center; font-weight: 800; color: #ef4444; font-size: 17px; }
  .neg .cube, .neg .rod, .neg .flat, .neg .big { opacity: .55; outline: 3px dashed #ef4444; outline-offset: 1px; }

  /* cube pieces */
  .cube { width: 18px; height: 18px; border-radius: 4px; background: var(--one);
          box-shadow: inset -3px -3px 0 var(--one-side), inset 2px 2px 0 rgba(255,255,255,.45); }
  .cube.part { background: linear-gradient(to top, var(--one) var(--p), rgba(255,138,61,.15) var(--p));
               box-shadow: inset 0 0 0 2px var(--one-side); }
  .rod { display: grid; grid-template-rows: repeat(10, 1fr); width: 18px; height: 120px; border-radius: 5px; overflow: hidden;
         background: var(--ten); box-shadow: inset -3px 0 0 var(--ten-side); }
  .rod i { border-bottom: 1px solid rgba(0,0,0,.18); }
  .flat { display: grid; grid-template: repeat(10,1fr) / repeat(10,1fr); width: 70px; height: 70px; border-radius: 6px; overflow: hidden;
          background: var(--hun); box-shadow: inset -4px -4px 0 var(--hun-side); }
  .flat i { border-right: 1px solid rgba(0,0,0,.15); border-bottom: 1px solid rgba(0,0,0,.15); }
  .big { width: 64px; height: 64px; position: relative; }
  .big b { position: absolute; inset: 10px 10px 0 0; background: var(--tho); border-radius: 6px;
           background-image: linear-gradient(rgba(0,0,0,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.12) 1px, transparent 1px);
           background-size: 5.4px 5.4px; }
  .big::before { content:""; position:absolute; left:10px; right:0; top:0; height:10px; background: #ff9cc6; transform: skewX(-45deg); transform-origin: bottom left; border-radius: 3px 3px 0 0; }
  .big::after { content:""; position:absolute; right:0; top:0; bottom:0; width:10px; background: var(--tho-side); transform: skewY(-45deg); transform-origin: top left; border-radius: 0 3px 3px 0; }
  .bigtext { font-size: 22px; font-weight: 800; color: #d23a7c; text-align: center; }

  .appear { animation: drop .4s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes drop { from { transform: translateY(-30px) scale(.4); opacity: 0 } to { transform: none; opacity: 1 } }

  .stage { flex: 1; min-height: 0; margin-top: 8px; border-top: 3px dashed #e8dcb5; padding-top: 10px; display: flex; gap: 6px; }
  .blocks { margin-top: 0 !important; border-top: none !important; padding-top: 0 !important; }
  /* ---- robot characters: every number is one robot carrying its cubes ---- */
  .blocks { flex-direction: column; flex-wrap: nowrap !important; justify-content: flex-end !important; align-items: center !important; gap: 8px !important; overflow: hidden !important; }
  .fit > * { flex-shrink: 0; }
  .fit { width: max-content; }
  .bot .window .items { max-width: 200px; }
  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; border-radius: 2px; z-index: 50; pointer-events: none; animation: fall 2s ease-in both; }
  @keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); } }
  .fit { display: flex; flex-wrap: nowrap; align-items: flex-end; justify-content: center; gap: 12px; transform-origin: bottom center; }
  .bot { --c: #34d399; --cd: #059669; display: flex; flex-direction: column; align-items: center; position: relative; }
  .bot .ant { width: 4px; height: 12px; background: #475569; position: relative; }
  .bot .ant::before { content: ""; position: absolute; top: -8px; left: -5px; width: 14px; height: 14px; border-radius: 50%;
                      background: #fde047; border: 2px solid #f59e0b; box-sizing: border-box; }
  .bot .head { width: 58px; height: 40px; border-radius: 14px 14px 10px 10px; background: var(--c); border: 3px solid var(--cd);
               position: relative; display: flex; justify-content: center; gap: 10px; padding-top: 8px; }
  .bot .eye { width: 13px; height: 13px; border-radius: 50%; background: #fff; position: relative; }
  .bot .eye::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #1e293b; left: 4px; top: 4px; }
  .bot .mouth { position: absolute; bottom: 5px; left: 50%; width: 18px; height: 8px; margin-left: -9px;
                border: 3px solid #1e293b; border-top: none; border-radius: 0 0 12px 12px; }

  /* keypad */
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 0 0 auto; height: 310px; }
  button {

<body>
  <h1><span>Cube</span> <span>Counter</span> <span>Calc</span></h1>
  <div class="calc">
    <div class="screen">
      <div class="expr" id="expr"></div>
      <div class="answer" id="answer">0</div>
      <div class="stage">

      <div class="blocks" id="blocks"><div class="hint">Press some numbers, then = to see your answer in blocks!</div></div>
      </div>
    </div>
    <div class="keys" id="keys"></div>
  </div>

<script>
(() => {
  const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  const layout = [
    ['C', 'clr'], ['back', 'util'], ['sound', 'util'], ['/', 'op'],
    ['7', 'r1'], ['8', 'r1'], ['9', 'r1'], ['*', 'op'],
    ['4', 'r2'], ['5', 'r2'], ['6', 'r2'], ['-', 'op'],
    ['1', 'r3'], ['2', 'r3'], ['3', 'r3'], ['+', 'op'],
    ['0', 'r4'], ['.', 'r4'], ['=', 'eq', 2]
  ];

  const keysEl = document.getElementById('keys');
  const exprEl = document.getElementById('expr');
  const ansEl = document.getElementById('answer');
  const blocksEl = document.getElementById('blocks');
  let tokens = [];      // e.g. ['12', '+', '3']
  let justSolved = false;
  let soundOn = true;
  const btnMap = {};

  // Columns of cubes: up to 5 tall = 1 column; 6–9 = 2 balanced columns (8 = 4 + 4).
  function colSizes(n) {
    if (n <= 5) return [n];
    const h = Math.ceil(n / 2);
    return [h, n - h];
  }
  function miniArray(n) {
    return `<div class="mini">${colSizes(n).map(c => `<div class="mcol">${'<s></s>'.repeat(c)}</div>`).join('')}</div>`;
  }

  // ---------- keypad ----------
  for (const [k, cls, span] of layout) {
    const b = document.createElement('button');
    b.className = cls;
    if (span) b.style.gridColumn = `span ${span}`;
    if (/^\d$/.test(k)) {
      const n = +k;
      const mini = n === 0 ? '<div class="mini zero"></div>' : miniArray(n);
      b.innerHTML = `<span class="num">${k}</span>${mini}`;
      b.setAttribute('aria-label', k);
    } else if (k === 'back') { b.textContent = '⌫'; b.setAttribute('aria-label', 'Delete'); }
    else if (k === 'sound') { b.textContent = 'Sound: On'; b.id = 'soundBtn'; }
    else if (k === 'C') { b.textContent = 'Clear'; }
    else b.textContent = OPS[k] || k;
    b.addEventListener('click', () => press(k));
    keysEl.appendChild(b);
    btnMap[k] = b;
  }

  // ---------- sound ----------
  let actx;
  function beep(freq = 520, dur = 0.08, type = 'sine') {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  // Synth trumpet: two detuned sawtooths through a "brassy" opening filter, with vibrato.
  function trumpet(freq, start, dur, vol = 0.12) {
    const t0 = actx.currentTime + start;
    const out = actx.createGain();
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.exponentialRampToValueAtTime(vol, t0 + 0.03);
    out.gain.setValueAtTime(vol, t0 + dur - 0.06);
    out.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.12);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
    lp.frequency.setValueAtTime(freq * 1.5, t0);
    lp.frequency.exponentialRampToValueAtTime(freq * 6, t0 + 0.06);
    lp.frequency.exponentialRampToValueAtTime(freq * 4, t0 + dur);
    const vib = actx.createOscillator(), vibGain = actx.createGain();
    vib.frequency.value = 5.5; vibGain.gain.setValueAtTime(0, t0); vibGain.gain.linearRampToValueAtTime(freq * 0.008, t0 + Math.min(dur, .4));
    vib.connect(vibGain);
    for (const detune of [-6, 6]) {
      const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = detune;
      vibGain.connect(o.frequency); o.connect(lp); o.start(t0); o.stop(t0 + dur + 0.2);
    }
    vib.start(t0); vib.stop(t0 + dur + 0.2);
    lp.connect(out).connect(actx.destination);
  }
  // Celebration fanfare: ta-ta-ta-TAAA ... TA-DAAAA! (with a big chord at the end)
  function fanfare() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const G4 = 392, C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5;
      trumpet(G4, 0.00, 0.10); trumpet(G4, 0.13, 0.10); trumpet(G4, 0.26, 0.10);
      trumpet(C5, 0.40, 0.35);
      trumpet(G4, 0.80, 0.14); trumpet(C5, 0.97, 0.14);
      [C5, E5, G5, C6].forEach(f => trumpet(f, 1.15, 0.95, 0.07));
      // drum hit under the last chord
      const t = actx.currentTime + 1.15, n = actx.createBufferSource(), buf = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      n.buffer = buf; const ng = actx.createGain(); ng.gain.value = 0.25; n.connect(ng).connect(actx.destination); n.start(t);
    } catch (e) {}
    confetti();
  }
  function confetti() {
    const colors = ['#ff5fa2', '#ffd23f', '#22c55e', '#60a5fa', '#a26bff', '#fb923c'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDelay = (Math.random() * 0.6 + 0.3) + 's';
      c.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      c.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
      c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }
  // Happy British voice: pick the best en-GB voice the computer has.
  const VOICE_PREFS = [/Google UK English Female/i, /Serena/i, /Kate/i, /Martha/i, /Stephanie/i, /Libby/i, /Sonia/i, /Hazel/i,
    /Susan/i, /Daniel/i, /Arthur/i, /Oliver/i, /George/i, /Ryan/i, /Google UK English Male/i];
  let ukVoice = null;
  function pickVoice() {
    if (!window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices();
    const gb = vs.filter(v => /en[-_]GB/i.test(v.lang));
    for (const re of VOICE_PREFS) { const v = gb.find(v => re.test(v.name)) || vs.find(v => re.test(v.name) && /en/i.test(v.lang)); if (v) { ukVoice = v; return; } }
    ukVoice = gb[0] || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text) {
    if (!soundOn || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (!ukVoice) pickVoice();
      if (ukVoice) u.voice = ukVoice;
      u.lang = 'en-GB'; u.rate = 1.05; u.pitch = 1.35; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  const WORDS = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];

  // ---------- input ----------
  const isOp = t => t in OPS;
  const last = () => tokens[tokens.length - 1];

  function press(k) {
    if (k !== '=') clearTimeout(window.__sayT);
    if (k === 'sound') {
      soundOn = !soundOn;
      document.getElementById('soundBtn').textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
      if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
      return;
    }
    if (k === 'C') { tokens = []; justSolved = false; beep(300, .12, 'square'); render(); showBlocks(null); ansEl.textContent = '0'; buddy('hop', 'Hi!'); return; }
    if (k === 'back') {
      if (justSolved) { press('C'); return; }
      const t = last();
      if (t === undefined) return;
      if (isOp(t) || t.length === 1) tokens.pop(); else tokens[tokens.length - 1] = t.slice(0, -1);
      beep(380); render(); return;
    }
    if (k === '=') { solve(); return; }

    if (/^\d$/.test(k) || k === '.') {
      if (justSolved) { tokens = []; justSolved = false; showBlocks(null); }
      const t = last();
      if (t === undefined || isOp(t)) {
        if (tokens.length === 0 || isOp(t)) tokens.push(k === '.' ? '0.' : k);
      } else {
        if (k === '.' && t.includes('.')) return;
        if (t.replace('-', '').replace('.', '').length >= 12) return;
        tokens[tokens.length - 1] = (t === '0' && k !== '.') ? k : t + k;
      }
      beep(440 + (+k || 0) * 40);
      buddy('hop', last());
      say(k === '.' ? 'Point!' : WORDS[+k] + '!');
      render(); return;
    }

    if (isOp(k)) {
      if (justSolved) { justSolved = false; showBlocks(null); }
      const t = last();
      if (t === undefined) {
        if (k === '-') tokens = ['0', '-']; // start with "0 −" so kids can make negatives
        else return;
      } else if (isOp(t)) tokens[tokens.length - 1] = k;
      else tokens.push(k);
      beep(660, .09, 'triangle'); render();
      buddy('hop', { '+': 'plus!', '-': 'minus!', '*': 'times!', '/': 'divided by!' }[k]);
    }
  }

  function render() {
    exprEl.textContent = tokens.map(t => OPS[t] || t).join(' ');
    if (!justSolved) {
      const t = last();
      ansEl.textContent = (t && !isOp(t)) ? t : (tokens.length ? ' ' : '0');
      showExpression(tokens);
    }
  }

  // ---------- math (no eval: precedence-aware) ----------
  function evaluate(toks) {
    const nums = [], ops = [];
    for (const t of toks) (isOp(t) ? ops : nums).push(isOp(t) ? t : parseFloat(t));
    if (nums.length !== ops.length + 1 || nums.some(isNaN)) return { error: 'Oops! Finish the problem first.' };
    // first pass × ÷
    const n2 = [nums[0]], o2 = [];
    for (let i = 0; i < ops.length; i++) {
      const op = ops[i], b = nums[i + 1];
      if (op === '*') n2[n2.length - 1] *= b;
      else if (op === '/') {
        if (b === 0) return { error: "Can't share with zero friends!" };
        n2[n2.length - 1] /= b;
      } else { o2.push(op); n2.push(b); }
    }
    let r = n2[0];
    for (let i = 0; i < o2.length; i++) r = o2[i] === '+' ? r + n2[i + 1] : r - n2[i + 1];
    r = Math.round(r * 1e10) / 1e10;
    return { value: r };
  }
  window.__evaluate = evaluate; // for testing

  function fmt(v) {
    if (Math.abs(v) >= 1e12) return v.toExponential(4);
    const rounded = Math.round(v * 1000) / 1000;
    return rounded.toLocaleString('en-US', { maximumFractionDigits: 3 });
  }

  function solve() {
    if (!tokens.length) return;
    let toks = tokens.slice();
    if (isOp(last())) toks.pop();
    const res = evaluate(toks);
    exprEl.textContent = toks.map(t => OPS[t] || t).join(' ') + ' =';
    ansEl.classList.remove('pop'); void ansEl.offsetWidth; ansEl.classList.add('pop');
    if (res.error) {
      ansEl.textContent = 'Hmm?'; showBlocks(null, res.error); buddy('oops', 'Uh oh!', 1800); beep(200, .25, 'sawtooth'); say(res.error);
      tokens = []; justSolved = true; return;
    }
    ansEl.textContent = fmt(res.value);
    showBlocks(res.value);
    fanfare();
    buddy('cheer', cheers[Math.floor(Math.random() * cheers.length)], 2200);
    const spoken = 'The answer is ' + fmt(res.value).replace(/,/g, '') + '! Brilliant!';
    clearTimeout(window.__sayT); window.__sayT = setTimeout(() => say(spoken), soundOn ? 2000 : 0);
    tokens = [String(res.value)];
    justSolved = true;
  }

  // ---------- blocks ----------
  const el = (cls, html = '') => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  function tower(n) {
    const t = el('tower');
    let d = 0;
    for (const c of colSizes(n)) {
      const col = el('tcol');
      for (let i = 0; i < c; i++) { const q = el('cube appear'); q.style.animationDelay = (d += 0.05) + 's'; col.appendChild(q); }
      t.appendChild(col);
    }
    return t;
  }

  // Builds the pieces for one number. labels=true adds "3 tens" style captions.
  function buildNumber(v, labels) {
    const wrap = el('row');
    const neg = v < 0, a = Math.abs(v);
    const whole = Math.floor(a + 1e-9);
    const frac = Math.round((a - whole) * 100) / 100;
    const th = Math.floor(whole / 1000), hu = Math.floor(whole / 100) % 10,
          te = Math.floor(whole / 10) % 10, on = whole % 10;
    let delay = 0;
    const addGroup = (count, make, label, single) => {
      if (!count) return;
      const g = el('group' + (neg ? ' neg' : ''));
      const items = el('items');
      for (let i = 0; i < (single ? 1 : count); i++) {
        const piece = make(); piece.classList.add('appear');
        piece.style.animationDelay = (delay += 0.06) + 's';
        items.appendChild(piece);
      }
      g.appendChild(items);
      if (labels) g.appendChild(el('label', label));
      wrap.appendChild(g);
    };
    if (th > 9) addGroup(1, () => { const g = el('row'); g.appendChild(el('big', '<b></b>')); g.appendChild(el('bigtext', '× ' + th)); return g; }, plural(th, 'thousand'), true);
    else addGroup(th, () => el('big', '<b></b>'), plural(th, 'thousand'));
    addGroup(hu, () => el('flat', '<i></i>'.repeat(100)), plural(hu, 'hundred'));
    addGroup(te, () => el('rod', '<i></i>'.repeat(10)), plural(te, 'ten'));
    addGroup(on, () => tower(on), plural(on, 'one'), true);
    if (frac > 0) {
      addGroup(1, () => { const c = el('cube part'); c.style.setProperty('--p', Math.round(frac * 100) + '%'); return c; },
        `a piece (${frac})`);
    }
    if (whole === 0 && frac === 0) wrap.appendChild(el('mini zero'));
    return wrap;
  }

  const BOT_COLORS = [['#34d399', '#059669'], ['#60a5fa', '#2563eb'], ['#c084fc', '#9333ea'], ['#fb7185', '#e11d48'], ['#fbbf24', '#d97706']];
  function makeBot(content, { idx = 0, tag = '', lbl = false, neg = false } = {}) {
    const b = el('bot idle' + (neg ? ' neg' : ''));
    const [c, cd] = BOT_COLORS[idx % BOT_COLORS.length];
    b.style.setProperty('--c', c); b.style.setProperty('--cd', cd);
    b.innerHTML = '<div class="ant"></div><div class="head"><div class="eye"></div><div class="eye"></div>' +
      '<div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div><div class="neck"></div>' +
      '<div class="torso"><div class="arm l"></div><div class="window"></div><div class="arm r"></div></div>' +
      '<div class="legs"><i></i><i></i></div>';
    if (content) b.querySelector('.window').appendChild(content);
    if (tag) b.appendChild(el('tag' + (lbl ? ' lbl' : ''), tag));
    return b;
  }
  function describe(v) {
    const a = Math.abs(v), whole = Math.floor(a + 1e-9), frac = Math.round((a - whole) * 100) / 100;
    const parts = [];
    const th = Math.floor(whole / 1000), hu = Math.floor(whole / 100) % 10, te = Math.floor(whole / 10) % 10, on = whole % 10;
    if (th) parts.push(plural(th, 'thousand')); if (hu) parts.push(plural(hu, 'hundred'));
    if (te) parts.push(plural(te, 'ten')); if (on) parts.push(plural(on, 'one'));
    if (frac) parts.push('a piece');
    return parts.join(' + ') || 'zero';
  }
  // Shrink the scene to fit the screen if a big number makes it too wide/tall.
  function fitScene(wrap) {
    requestAnimationFrame(() => {
      wrap.style.transform = '';
      const note = blocksEl.querySelector('.neg-note');
      const w = blocksEl.clientWidth - 8, h = blocksEl.clientHeight - 40 - (note ? note.offsetHeight + 14 : 0);
      const r = Math.min(1, w / wrap.scrollWidth, h / wrap.scrollHeight);
      if (r < 1) wrap.style.transform = `scale(${r})`;
    });
  }
  function scene(nodes, note) {
    blocksEl.innerHTML = '';
    blocksEl.classList.remove('small');
    if (note) blocksEl.appendChild(el('neg-note', note));
    const wrap = el('fit');
    nodes.forEach(n => wrap.appendChild(n));
    blocksEl.appendChild(wrap);
    fitScene(wrap);
  }

  function showBlocks(v, msg) {
    if (v === null || v === undefined) {
      scene([makeBot(null, { tag: msg || 'Press a number!', lbl: !!msg })]);
      return;
    }
    if (Math.abs(v) >= 100000) {
      scene([makeBot(el('bigtext', 'WOW!'), { tag: 'Too big to build!', lbl: true })]);
      return;
    }
    const content = v === 0 ? null : buildNumber(v, false);
    scene([makeBot(content, { tag: v === 0 ? 'zero — no blocks!' : describe(v), lbl: true, neg: v < 0 })],
      v < 0 ? 'Below zero! (a negative number)' : '');
  }

  // Live view while typing: one robot per number, with the math signs between them.
  function showExpression(toks) {
    const nums = toks.filter(t => !isOp(t));
    if (!nums.length) { showBlocks(null); return; }
    const nodes = []; let idx = 0;
    for (const t of toks) {
      if (isOp(t)) { nodes.push(el('opsign', OPS[t])); continue; }
      const v = parseFloat(t);
      let content = null;
      if (isNaN(v)) content = null;
      else if (Math.abs(v) >= 100000) content = el('bigtext', 'WOW!');
      else if (v !== 0) content = buildNumber(v, false);
      nodes.push(makeBot(content, { idx: idx++, tag: t, neg: v < 0 }));
    }
    scene(nodes);
  }

  // ---------- robot moods ----------
  let moodTimer;
  function buddy(mood, text, ms = 1400) {
    clearTimeout(moodTimer);
    const bots = [...blocksEl.querySelectorAll('.bot')];
    const target = mood === 'cheer' ? bots : bots.slice(-1);
    bots.forEach(b => b.querySelector('.bubble')?.remove());
    target.forEach(b => { b.classList.remove('idle', 'hop', 'cheer', 'oops'); void b.offsetWidth; b.classList.add(mood); });
    const speaker = bots[bots.length - 1];
    if (speaker && text) speaker.appendChild(el('bubble', text));
    moodTimer = setTimeout(() => bots.forEach(b => { b.classList.remove('hop', 'cheer', 'oops'); b.classList.add('idle'); b.querySelector('.bubble')?.remove(); }), ms);
  }
  const cheers = ['Yay!', 'Woo-hoo!', 'You got it!', 'Great job!', 'Awesome!'];

  showBlocks(null);

  // ---------- keyboard ----------
  const keyAlias = { 'Enter': '=', '=': '=', 'Backspace': 'back', 'Escape': 'C', 'c': 'C', 'C': 'C', 'x': '*', 'X': '*' };
  document.addEventListener('keydown', e => {
    let k = keyAlias[e.key] || e.key;
    if (!(/^\d$/.test(k) || k === '.' || isOp(k) || ['=', 'back', 'C'].includes(k))) return;
    e.preventDefault();
    const b = btnMap[k]; if (b) { b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 110); }
    press(k);
  });
})();
</script>
</body>
</html>
