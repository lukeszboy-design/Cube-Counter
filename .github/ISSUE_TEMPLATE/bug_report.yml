name: Bug report
description: Something in Cube Counters isn't working right
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you tap or type, in order?
      placeholder: |
        1. Tap Challenge
        2. Pick "+ − to 10"
        3. Type 7 and press =
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Device, browser or app, for example "Chromebook, Chrome", "iPad, Safari" or "Mac app 1.1.1".
    validations:
      required: true
